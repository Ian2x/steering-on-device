name: SteerDemo
options:
  bundleIdPrefix: com.ianwang
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  SteeringKit:
    path: SteeringKit
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples
    exactVersion: 2.29.1
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.29.1
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.0.0

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0

targets:
  SteerDemo:
    type: application
    platform: macOS
    sources:
      - path: SteerDemo
      - path: Resources/Lexicons/lexicons.json
        buildPhase: resources
      - path: Resources/CoreML/TopicEncoder.mlpackage
        buildPhase: resources
      - path: Resources/CoreML/topic-centroids.json
        buildPhase: resources
      - path: Resources/MiniLMTokenizer
        buildPhase: resources
        type: folder
    dependencies:
      - package: SteeringKit
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
      - package: MLXSwift
        product: MLX
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ianwang.SteerDemo
        PRODUCT_NAME: SteerDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SteerDemo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        CODE_SIGN_ENTITLEMENTS: SteerDemo/SteerDemo.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  SteerDemo:
    build:
      targets:
        SteerDemo: all
    run:
      config: Debug

